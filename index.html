<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UKM Lapang Sasar Golf - TikTok Mini Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 854px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    header {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      color: #fff;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    .logo-text {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-group {
      display: flex;
      gap: 12px;
    }
    .stat-box {
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 12px;
      text-align: center;
      min-width: 60px;
    }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #2e7d32;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #controls {
      padding: 12px 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .controls-top-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      background: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
    }
    .aim-slider-container {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .aim-slider-container span {
      color: #aaa;
      font-size: 11px;
      font-weight: 700;
    }
    input[type=range] {
      flex: 1;
      accent-color: #0284c7;
      height: 6px;
      cursor: pointer;
    }
    .meter-wrapper {
      position: relative;
      width: 100%;
      height: 24px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e 0%, #eab308 70%, #ef4444 100%);
      transition: width 0.03s linear;
    }
    .meter-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .shoot-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .shoot-btn:active, .shoot-btn.holding {
      transform: scale(0.97);
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.6);
    }
    .recenter-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(4px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
      color: #fff;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: 32px;
      color: #ffd700;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(255,215,0,0.5);
    }
    .overlay p {
      font-size: 16px;
      margin-bottom: 24px;
      color: #cbd5e1;
    }
    .overlay-btn {
      padding: 14px 32px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <div class="logo-badge">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ffd700' stroke='%23ffffff' stroke-width='4'/><text x='50' y='55' font-size='22' font-weight='900' fill='%23111111' text-anchor='middle'>UKM</text></svg>" alt="UKM Logo">
      <div class="logo-text">UKM Lapang<br>Sasar Golf</div>
    </div>
    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-label">Hole</div>
        <div class="stat-value" id="hole-val">1/10</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Par</div>
        <div class="stat-value" id="par-val">3</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Strokes</div>
        <div class="stat-value" id="strokes-val">0</div>
      </div>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <button class="recenter-btn" id="recenterBtn">🎯 Center Ball</button>
  </div>

  <div id="controls">
    <div class="controls-top-row">
      <button class="toggle-btn active" id="modeBtn">🎯 AIM MODE</button>
      <div class="aim-slider-container">
        <span>ANGLE</span>
        <input type="range" id="angleSlider" min="-180" max="180" value="0">
      </div>
    </div>

    <div class="meter-wrapper">
      <div class="meter-bar" id="meterBar"></div>
      <div class="meter-text" id="meterText">0% POWER</div>
    </div>

    <button class="shoot-btn" id="shootBtn">HOLD TO SHOOT</button>
  </div>

  <div class="overlay hidden" id="gameOverModal">
    <h1 id="modalTitle">CHAMPION!</h1>
    <p id="modalDesc">You completed all 10 holes!</p>
    <button class="overlay-btn" id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const holeVal = document.getElementById('hole-val');
  const parVal = document.getElementById('par-val');
  const strokesVal = document.getElementById('strokes-val');
  const meterBar = document.getElementById('meterBar');
  const meterText = document.getElementById('meterText');
  const shootBtn = document.getElementById('shootBtn');
  const modeBtn = document.getElementById('modeBtn');
  const angleSlider = document.getElementById('angleSlider');
  const recenterBtn = document.getElementById('recenterBtn');
  const gameOverModal = document.getElementById('gameOverModal');
  const restartBtn = document.getElementById('restartBtn');

  let audioCtx = null;
  function playSound(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } else if (type === 'hole') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    } catch(e){}
  }
