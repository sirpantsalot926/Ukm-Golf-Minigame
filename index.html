<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UKM Lapang Sasar Golf - TikTok Mini Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 854px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(180deg, #1e3c72 0%, #2a5298 100%);
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
    }
    /* Header Bar */
    header {
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      color: #fff;
      border-bottom: 2px solid rgba(255,255,255,0.1);
    }
    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }
    .logo-text {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stats-group {
      display: flex;
      gap: 12px;
    }
    .stat-box {
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 12px;
      text-align: center;
      min-width: 60px;
    }
    .stat-label {
      font-size: 9px;
      text-transform: uppercase;
      opacity: 0.8;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 15px;
      font-weight: 900;
      color: #fff;
    }
    /* Canvas Viewport */
    #canvas-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: #2e7d32;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Controls Area */
    #controls {
      padding: 12px 16px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 2px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    /* Mode Toggle & Aim Controls */
    .controls-top-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      background: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: #0284c7;
      box-shadow: 0 0 12px rgba(2, 132, 199, 0.5);
    }
    .aim-slider-container {
      flex: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 12px;
    }
    .aim-slider-container span {
      color: #aaa;
      font-size: 11px;
      font-weight: 700;
    }
    input[type=range] {
      flex: 1;
      accent-color: #0284c7;
      height: 6px;
      cursor: pointer;
    }
    /* Meter */
    .meter-wrapper {
      position: relative;
      width: 100%;
      height: 24px;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.2);
    }
    .meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e 0%, #eab308 70%, #ef4444 100%);
      transition: width 0.03s linear;
    }
    .meter-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    /* Shoot Button */
    .shoot-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .shoot-btn:active, .shoot-btn.holding {
      transform: scale(0.97);
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.6);
    }
    /* Floating Re-center Button */
    .recenter-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(4px);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* Modal / Overlay */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 24px;
      text-align: center;
      color: #fff;
    }
